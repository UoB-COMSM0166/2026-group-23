<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quantum Drop — 数字塔防</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #050810;
      /* 画布外的"赛博空间"：扫描线 + 科幻网格 + 径向暗角（从外向内渐暗到纯黑）*/
      background-image:
        /* 顶层：细扫描线（每 3px 一条青光，极低不透明度）*/
        repeating-linear-gradient(
          0deg,
          rgba(0, 200, 255, 0.025) 0 1px,
          transparent 1px 3px
        ),
        /* 中层：科幻网格（每 60px 的经纬线）*/
        repeating-linear-gradient(
          90deg,
          rgba(0, 140, 220, 0.05) 0 1px,
          transparent 1px 60px
        ),
        repeating-linear-gradient(
          0deg,
          rgba(0, 140, 220, 0.05) 0 1px,
          transparent 1px 60px
        ),
        /* 底层：径向暗角，中心略亮，边缘化黑 */
        radial-gradient(
          ellipse at center,
          rgba(0, 80, 140, 0.25) 0%,
          rgba(5, 8, 16, 1)      70%
        );
    }
    /* 画布自身加青色发光描边，把"舞台"和"外界"在视觉上分开 */
    canvas {
      display: block;
      box-shadow:
        0 0 0 1px rgba(0, 200, 255, 0.35),
        0 0 40px rgba(0, 180, 255, 0.25),
        0 0 80px rgba(90, 50, 200, 0.15);
      /* CSS 缩放时保留清晰度（让浏览器用最近邻优先，而非过度平滑）*/
      image-rendering: auto;
    }
  </style>

  <!-- Third-party libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>

  <!-- -- Global mutable state (centralised; must load first) -- -->
  <script src="state.js"></script>        <!-- GamePhase / coins / manager / UI state / currentLang / audioMuted etc. -->
  <script src="i18n.js"></script>         <!-- I18N dictionary + t(key) lookup + setLang() -->
  <script src="audio.js"></script>        <!-- BGM / SFX manager (native HTMLAudio, no p5.sound dependency) -->

  <!-- -- Pure data configuration (data/, must load before modules that depend on it) -- -->
  <script src="data/towers.js"></script>  <!-- TOWER_DEFS -->
  <script src="data/waves.js"></script>   <!-- WAVE_CONFIGS / WAVE_CONFIG -->
  <script src="data/levels.js"></script>  <!-- LEVEL_INFO / LEVEL_NODES -->

  <!-- -- Map system (map/ folder, loaded in order) -- -->
  <script src="map/map-core.js"></script>  <!-- Path definitions, cell tests, caches, drawPaths, shared helpers -->
  <script src="map/map-lv1.js"></script>   <!-- Level 1: grassland -->
  <script src="map/map-lv2.js"></script>   <!-- Level 2: nebula icy blue -->
  <script src="map/map-lv3.js"></script>   <!-- Level 3: lava core -->
  <script src="map/map-lv4.js"></script>   <!-- Level 4: void maze -->
  <script src="map/map-lv5.js"></script>   <!-- Level 5: scorched ruins -->

  <!-- -- Game core: monsters (base class -> normal -> Boss -> manager) -- -->
  <script src="monsters/core.js"></script>              <!-- Path utilities, particles, Monster base class -->
  <script src="monsters/mobs/snake.js"></script>        <!-- MechSnake -->
  <script src="monsters/mobs/spider.js"></script>       <!-- MechSpider -->
  <script src="monsters/mobs/robot.js"></script>        <!-- MechRobot -->
  <script src="monsters/mobs/phoenix.js"></script>      <!-- MechPhoenix -->
  <script src="monsters/mobs/tank.js"></script>         <!-- MechTank -->
  <script src="monsters/mobs/ghostbird.js"></script>    <!-- GhostBird -->
  <script src="monsters/bosses/fission.js"></script>    <!-- BossFission + FissionCore -->
  <script src="monsters/bosses/phantom.js"></script>    <!-- BossPhantom -->
  <script src="monsters/bosses/antmech.js"></script>    <!-- BossAntMech -->
  <script src="monsters/bosses/carrier.js"></script>    <!-- BossCarrier -->
  <script src="monsters/manager.js"></script>           <!-- MonsterManager -->

  <!-- -- Game core: towers (base first, then 8 variants inject behavior via prototype) -- -->
  <script src="towers/base.js"></script>              <!-- Tower base class (constructor / upgrade / scheduling) -->
  <script src="towers/variants/rapid.js"></script>    <!-- RAPID Rapid Tower -->
  <script src="towers/variants/laser.js"></script>    <!-- LASER Laser Cutter -->
  <script src="towers/variants/nova.js"></script>     <!-- NOVA Nova Cannon -->
  <script src="towers/variants/chain.js"></script>    <!-- CHAIN Chain Arc Tower -->
  <script src="towers/variants/magnet.js"></script>   <!-- MAGNET Magnetic Jammer -->
  <script src="towers/variants/ghost.js"></script>    <!-- GHOST Ghost Missile -->
  <script src="towers/variants/scatter.js"></script>  <!-- SCATTER Scatter AA Gun -->
  <script src="towers/variants/cannon.js"></script>   <!-- CANNON Orbital Cannon -->
  <script src="towers/projectile.js"></script>        <!-- Projectile bullet class -->
  <script src="towers/effects.js"></script>           <!-- Chain / explosion / mortar visuals -->
  <script src="towers/manager.js"></script>           <!-- towers[]/projectiles[] + updateAndDrawTowers -->
  <script src="home-tower.js"></script>               <!-- HomeTower base structure -->
  <script src="waves.js"></script>                    <!-- Wave progression logic -->
  <script src="minigame.js"></script>                 <!-- Ball-throwing minigame -->

  <!-- -- Combat UI (ui/, common first, index last) -- -->
  <script src="ui/common.js"></script>       <!-- Constants / HUD cache / utilities / click effects -->
  <script src="ui/hud.js"></script>          <!-- Top HUD -->
  <script src="ui/pause.js"></script>        <!-- Pause menu -->
  <script src="ui/wave-ui.js"></script>      <!-- Wave countdown / end panel / clear notice -->
  <script src="ui/build-menu.js"></script>   <!-- Bottom build menu + hover tooltip -->
  <script src="ui/tower-panel.js"></script>  <!-- Tower upgrade / sell panel -->
  <script src="ui/placement.js"></script>    <!-- Placement preview + battlefield click router -->
  <script src="ui/perf-hud.js"></script>     <!-- Performance overlay (toggle with F, available in all phases) -->
  <script src="ui/index.js"></script>        <!-- drawUI / initUI dispatch -->

  <!-- -- Full-screen interfaces (screens/) -- -->
  <script src="screens/launch-screen.js"></script>      <!-- Launch page + test entry -->
  <script src="screens/difficulty-select.js"></script>  <!-- Difficulty select -->
  <script src="screens/level-map.js"></script>          <!-- Level map -->
  <script src="screens/end-panel.js"></script>          <!-- End panel -->

  <!-- -- Tutorial (depends on state.js + ui constants, must load before sketch.js) -- -->
  <script src="tutorial.js"></script>      <!-- 5-step tutorial shown on the first visit to level 1 -->

  <!-- -- Main loop (loaded last) -- -->
  <script src="sketch.js"></script>        <!-- setup / draw / event routing -->
</head>
<body></body>
</html>
